<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // 다크 모드: 저장된 선택(light/dark)을 화면 그리기 전에 적용 (깜빡임 방지). 없으면 기기 설정 따름
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
          var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#121212" : "#ffffff");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Today's News</title>
    <script>
      // 공유 링크(/a/<id>/)로 들어왔는데 앱(서비스워커)이 이 페이지를 대신 열었으면 기사 화면으로
      (function () {
        var m = location.pathname.match(/^(.*\/)a\/([\w-]+)\/?$/);
        if (m) location.replace(m[1] + "#/article/" + m[2]);
      })();
      // 홈 화면 앱으로 열렸는지: 표준 방식 + iOS 전용 navigator.standalone (화면 그리기 전에 판단해서 깜빡임 없음)
      if (matchMedia("(display-mode: standalone)").matches || navigator.standalone === true)
        document.documentElement.classList.add("standalone");
    </script>

    <!-- 링크 공유 미리보기 (카카오톡·슬랙·X 등). 크롤러는 JS를 안 돌려서 사이트 공통 정보만 -->
    <meta name="description" content="금감원·금융위 보도자료를 PDF까지 읽어 요약하고, 경제·정치·IT·과학·문화 뉴스를 매시간 정리합니다." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Today's News" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://minijae011030.github.io/TodaysNews/" />
    <meta property="og:title" content="Today's News — 금융당국 보도자료와 오늘의 뉴스" />
    <meta property="og:description" content="금감원·금융위 보도자료를 PDF까지 읽어 요약하고, 경제·정치·IT·과학·문화 뉴스를 매시간 정리합니다." />
    <meta property="og:image" content="https://minijae011030.github.io/TodaysNews/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Today's News" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
